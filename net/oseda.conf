# HTTP -> HTTPS
<VirtualHost *:80>
    ServerName oseda.net
    ServerAlias www.oseda.net

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://oseda.net%{REQUEST_URI} [L,R=301]
</VirtualHost>

# HTTPS + Proxy
<VirtualHost *:443>
    ServerName oseda.net
    ServerAlias www.oseda.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/oseda.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/oseda.net/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # API goes to backend
    ProxyPass /api/ http://localhost:3001/api/
    ProxyPassReverse /api/ http://localhost:3001/api/

    # Everything else (SPA) goes to backend
    ProxyPass / http://localhost:3001/
    ProxyPassReverse / http://localhost:3001/

    ErrorLog ${APACHE_LOG_DIR}/oseda_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/oseda_ssl_access.log combined

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    </IfModule>
</VirtualHost>
