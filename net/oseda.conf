<VirtualHost *:80>
    ServerName oseda.net
    ServerAlias www.oseda.net


    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    ProxyPass "/api/" "http://localhost:3001/"
    ProxyPassReverse "/api/" "http://localhost:3001/"

    <Proxy *>
        Order allow,deny
        Allow from all
    </Proxy>

    ErrorLog ${APACHE_LOG_DIR}/webapp_error.log
    CustomLog ${APACHE_LOG_DIR}/webapp_access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =oseda.net [OR]
RewriteCond %{SERVER_NAME} =www.oseda.net
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

