<VirtualHost *:80>
    ServerName oseda.net
    ServerAlias www.oseda.net

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://oseda.net%{REQUEST_URI} [L,R=301]
</VirtualHost>
<VirtualHost *:443>
    ServerName oseda.net
    ServerAlias www.oseda.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/oseda.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/oseda.net/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    DocumentRoot /home/ubuntu/oseda-core/frontend/build
    <Directory /home/ubuntu/oseda-core/frontend/build>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On

    # never rewrite /api/*
    RewriteCond %{REQUEST_URI} !^/api/

    # ignore real files and dirs
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d

    # fallback to React index.html
    RewriteRule ^ /index.html [L]

    ErrorLog ${APACHE_LOG_DIR}/oseda_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/oseda_ssl_access.log combined
</VirtualHost>
