<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/OsedaLogo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="Open Source Education Association"
        />
        <meta name="keywords" content="OSEDA, open source, education, learning" />
        <link rel="canonical" href="https://oseda.net" />

        <!-- open graph preview things -->
        <meta property="og:title" content="Oseda" />
        <meta property="og:description" content="Open Source Education Association" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://oseda.net" />
        <meta property="og:image" content="%PUBLIC_URL%/OsedaLogo.png" />

        <!-- twitter (X) card previews -->
        <!-- I have absolutely no intention of this ever being useful -->
        <!-- but the internet tells me its good for SEO -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Oseda" />
        <meta name="twitter:description" content="Open Source Education Association" />
        <meta name="twitter:image" content="%PUBLIC_URL%/OsedaLogo.png" />

        <link rel="apple-touch-icon" href="%PUBLIC_URL%/OsedaLogo.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <title>Oseda</title>

        <!-- i'm interested in tracking monthly active users now that we have SEO -->
        <script
            data-goatcounter="https://oseda.goatcounter.com/count"
            async
            src="//gc.zgo.at/count.js">
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
